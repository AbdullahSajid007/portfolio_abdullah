        // --- 3D COMPONENTS ---

        // 1. Interactive 3D Network Globe (Canvas-based)
        const NetworkGlobe = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                // 3D Point Setup
                const numPoints = 60;
                const points = [];
                const radius = Math.min(window.innerWidth, window.innerHeight) * 0.3;

                for (let i = 0; i < numPoints; i++) {
                    const theta = Math.acos(2 * Math.random() - 1);
                    const phi = Math.sqrt(numPoints * Math.PI) * phi_fn(i); // Golden spiral
                    
                    points.push({
                        x: radius * Math.sin(theta) * Math.cos(phi),
                        y: radius * Math.sin(theta) * Math.sin(phi),
                        z: radius * Math.cos(theta)
                    });
                }

                function phi_fn(k) {
                    return k * (1 + Math.sqrt(5)) / 2; // Golden ratio
                }

                let angleX = 0;
                let angleY = 0;

                // Animation Loop
                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    
                    // Auto-rotation
                    angleX += 0.003;
                    angleY += 0.003;

                    const projectedPoints = points.map(p => {
                        // Rotation X
                        let y = p.y * Math.cos(angleX) - p.z * Math.sin(angleX);
                        let z = p.y * Math.sin(angleX) + p.z * Math.cos(angleX);
                        let x = p.x;

                        // Rotation Y
                        let xx = x * Math.cos(angleY) - z * Math.sin(angleY);
                        let zz = x * Math.sin(angleY) + z * Math.cos(angleY);
                        
                        // 3D Projection
                        const scale = 400 / (400 + zz);
                        return {
                            x: xx * scale + centerX,
                            y: y * scale + centerY,
                            z: zz,
                            scale: scale
                        };
                    });

                    // Draw Connections (Networking visualization)
                    ctx.strokeStyle = 'rgba(34, 211, 238, 0.15)'; // Cyan with low opacity
                    ctx.lineWidth = 1;
                    
                    for (let i = 0; i < projectedPoints.length; i++) {
                        const p1 = projectedPoints[i];
                        
                        // Draw Nodes
                        const opacity = Math.max(0.1, (p1.scale - 0.5) * 2); // Fade out back nodes
                        ctx.fillStyle = `rgba(34, 211, 238, ${opacity})`; 
                        ctx.beginPath();
                        ctx.arc(p1.x, p1.y, 2 * p1.scale, 0, Math.PI * 2);
                        ctx.fill();

                        // Connect nearby nodes
                        for (let j = i + 1; j < projectedPoints.length; j++) {
                            const p2 = projectedPoints[j];
                            const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                            if (dist < 100 * p1.scale) { // Connect if close
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    }

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0" />;
        };

        // 2. 3D Tilt Card Component
        const TiltCard = ({ children, className }) => {
            const [transform, setTransform] = useState('');
            const [style, setStyle] = useState({});

            const handleMouseMove = (e) => {
                const card = e.currentTarget;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Calculate rotation (-15deg to 15deg)
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;

                setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
                
                // Glossy shine effect
                setStyle({
                    '--x': `${x}px`,
                    '--y': `${y}px`
                });
            };

            const handleMouseLeave = () => {
                setTransform('perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)');
            };

            return (
                <div 
                    className={`transition-transform duration-200 ease-out will-change-transform ${className}`}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}
                    style={{ transform }}
                >

                        case '':

                        default:

                    setHistory([...newHistory, ...response]);

                }

            return (

                            <Terminal size={12} /> guest@portfolio:~
                        </div>
                        <div className="flex space-x-2 text-slate-500">
                            <Minus size={14} />
                            <Maximize2 size={14} />
                        </div>
                    </div>

                    {/* Terminal Content */}
                    <div className="p-4 h-80 overflow-y-auto space-y-2">
                        {history.map((line, i) => (
                            <div key={i} className={`${
                                line.type === 'user' ? 'text-slate-300 font-bold mt-4' :
                                line.type === 'error' ? 'text-red-400' :
                                line.type === 'success' ? 'text-green-400' :

                                {line.type === 'user' && <span className="text-green-500 mr-2">➜ ~</span>}

                            <input 
                                type="text"

                    content: (

                            <div className="bg-cyan-900/20 border-l-4 border-cyan-500 p-4 rounded-r">
                                <h4 className="font-bold text-cyan-400 flex items-center gap-2"><Lightbulb size={18} /> Key Takeaway</h4>
                                <p className="text-sm text-slate-300 mt-1">Troubleshooting always starts from the bottom (Physical) up. If the cable is unplugged, no amount of software configuration will fix it.</p>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-white mb-4">The 7-Layer Stack</h3>
                                <p className="mb-4">Think of data like a package being wrapped (Encapsulation) as it goes down, and unwrapped (Decapsulation) as it goes up.</p>
                                <div className="space-y-2 font-mono text-sm">
                                    {[
                                        { l: 7, n: "Application", d: "HTTP, DNS - What you see", c: "bg-purple-900/40 text-purple-200 border-purple-500" },
                                        { l: 6, n: "Presentation", d: "Encryption, Encoding (SSL/TLS)", c: "bg-indigo-900/40 text-indigo-200 border-indigo-500" },
                                        { l: 5, n: "Session", d: "Maintaining connections", c: "bg-blue-900/40 text-blue-200 border-blue-500" },
                                        { l: 4, n: "Transport", d: "TCP/UDP - Reliability", c: "bg-cyan-900/40 text-cyan-200 border-cyan-500" },
                                        { l: 3, n: "Network", d: "IP Addressing, Routing", c: "bg-teal-900/40 text-teal-200 border-teal-500" },
                                        { l: 2, n: "Data Link", d: "MAC Addresses, Switching", c: "bg-emerald-900/40 text-emerald-200 border-emerald-500" },
                                        { l: 1, n: "Physical", d: "Cables, Fiber, Bits (0/1)", c: "bg-slate-800 text-slate-300 border-slate-500" }
                                    ].map(layer => (
                                        <div key={layer.l} className={`p-3 rounded border-l-4 flex justify-between items-center ${layer.c}`}>
                                            <span className="font-bold">Layer {layer.l}: {layer.n}</span>
                                            <span className="text-xs opacity-75 hidden sm:block">{layer.d}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ),
                    quiz: {
                        question: "Your browser cannot load a webpage, but you can ping the server's IP address successfully. Which layer is likely the issue?",
                        options: [
                            "Layer 1 (Physical) - The cable is broken",
                            "Layer 3 (Network) - Routing is failing",
                            "Layer 7 (Application) - DNS or Server Config"
                        ],
                        correct: 2,
                        explanation: "Since Ping (Layer 3) works, the physical connection and routing are fine. The issue is likely higher up, such as DNS resolution or the Web Server itself (Layer 7)."
                    }
                },
                {
                    id: 2,
                    title: "C++: Pointers vs References Code Lab",
                    excerpt: "See the code side-by-side. Understand exactly when to use * vs & to write safer, faster C++.",
                    date: "Sep 28, 2024",
                    readTime: "4 min read",
                    category: "C++",
                    content: (
                        <div className="space-y-8">
                            <div className="bg-cyan-900/20 border-l-4 border-cyan-500 p-4 rounded-r">
                                <h4 className="font-bold text-cyan-400 flex items-center gap-2"><Lightbulb size={18} /> Pro Tip</h4>
                                <p className="text-sm text-slate-300 mt-1">Always prefer <strong>References (&)</strong> for function parameters unless you explicitly need to handle NULL values or reseat the variable.</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-sm">
                                    <h4 className="text-purple-400 font-bold mb-2">// Pointers (*)</h4>
                                    <p className="text-slate-500">// Can be NULL</p>
                                    <p><span className="text-blue-400">int</span>* ptr = <span className="text-blue-400">nullptr</span>;</p>
                                    <br/>
                                    <p className="text-slate-500">// Can be changed</p>
                                    <p>ptr = &variableA;</p>
                                    <p>ptr = &variableB;</p>
                                    <br/>
                                    <p className="text-slate-500">// Must dereference</p>
                                    <p>*ptr = 10;</p>
                                </div>
                                <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-sm">
                                    <h4 className="text-green-400 font-bold mb-2">// References (&)</h4>
                                    <p className="text-slate-500">// Cannot be NULL</p>
                                    <p><span className="text-blue-400">int</span>& ref = variableA;</p>
                                    <br/>
                                    <p className="text-slate-500">// Cannot be changed</p>
                                    <p className="text-red-400">ref = &variableB; // Error!</p>
                                    <br/>
                                    <p className="text-slate-500">// Clean syntax</p>
                                    <p>ref = 10;</p>
                                </div>
                            </div>
                        </div>
                    ),
                    quiz: {
                        question: "You need to pass a large object to a function, but that object might not exist (it could be null). What should you use?",
                        options: [
                            "Pass by Reference (&)",
                            "Pass by Pointer (*)",
                            "Pass by Value"
                        ],
                        correct: 1,
                        explanation: "References cannot be null. If the object might not exist, you must use a Pointer so you can check if it is nullptr before using it."
                    }
                },
                {
                    id: 3,
                    title: "Visualizing Big O Notation",
                    excerpt: "Why does your code slow down when data grows? Visualizing algorithmic efficiency.",
                    date: "Aug 15, 2024",
                    readTime: "6 min read",
                    category: "Algorithms",
                    content: (
                        <div className="space-y-8">
                            <div className="bg-cyan-900/20 border-l-4 border-cyan-500 p-4 rounded-r">
                                <h4 className="font-bold text-cyan-400 flex items-center gap-2"><Lightbulb size={18} /> The Rule</h4>
                                <p className="text-sm text-slate-300 mt-1">Avoid nested loops! A loop inside a loop turns O(n) into O(n²), which is a performance killer for large datasets.</p>
                            </div>
                            <div className="space-y-4">
                                <h3 className="text-xl font-bold text-white">Efficiency Growth</h3>
                                <div className="space-y-3">
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span className="text-green-400 font-bold">O(1) - Instant</span>
                                            <span className="text-slate-500">Hash Maps</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-green-500 h-2 rounded-full" style={{width: "5%"}}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span className="text-yellow-400 font-bold">O(log n) - Efficient</span>
                                            <span className="text-slate-500">Binary Search</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-yellow-500 h-2 rounded-full" style={{width: "15%"}}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span className="text-orange-400 font-bold">O(n) - Linear</span>
                                            <span className="text-slate-500">Simple Loops</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-orange-500 h-2 rounded-full" style={{width: "40%"}}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <span className="text-red-500 font-bold">O(n²) - Slow</span>
                                            <span className="text-slate-500">Nested Loops</span>
                                        </div>
                                        <div className="w-full bg-slate-800 rounded-full h-2">
                                            <div className="bg-red-600 h-2 rounded-full" style={{width: "90%"}}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ),
                    quiz: {
                        question: "Which of these operations is the fastest (O(1))?",
                        options: [
                            "Finding a value in a sorted array (Binary Search)",
                            "Looking up a value by key in a Hash Map",
                            "Finding the maximum value in an unsorted list"
                        ],
                        correct: 1,
                        explanation: "Hash Maps allow direct access to data using a key, taking constant time O(1). Binary search is O(log n), and finding a max value is O(n)."
                    }
                }
            ];

                        </button>

                    {/* Navigation */}

                                {profile.name.split(' ')[0]}<span className="text-cyan-400">.</span>
                            </a>

                            <div className="hidden md:flex space-x-8 items-center">
                                {navLinks.map((link) => (
                                    <a key={link.name} href={link.href} className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">

                        {isMenuOpen && (

                                    </a>
                                ))}
                            </div>
                        )}

                    {/* Main Content */}

                        {/* Hero Section with 3D Globe */}

                            <div className="absolute top-20 right-0 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl -z-10"></div>

                                                                    quizSelection === idx 
                                                                    ? 'bg-cyan-900/30 border-cyan-500 text-white' 
                                                                    : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'
                                                                }`}
                                                            >
                                                                <span className="font-bold mr-2 text-slate-500">{String.fromCharCode(65 + idx)}.</span> {option}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <button 
                                                        onClick={() => setQuizSubmitted(true)}
                                                        disabled={quizSelection === null}
                                                        className="mt-6 w-full py-3 bg-cyan-500 hover:bg-cyan-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-900 font-bold rounded-xl transition-colors"
                                                    >
                                                        Check Answer
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="animate-in fade-in zoom-in-95 duration-300">
                                                    <div className={`p-4 rounded-xl flex items-start gap-4 mb-4 ${
                                                        quizSelection === activeBlog.quiz.correct 
                                                        ? 'bg-green-900/20 border border-green-500/50' 
                                                        : 'bg-red-900/20 border border-red-500/50'
                                                    }`}>
                                                        {quizSelection === activeBlog.quiz.correct ? (
                                                            <CheckCircle className="text-green-500 shrink-0 mt-1" />
                                                        ) : (
                                                            <AlertCircle className="text-red-500 shrink-0 mt-1" />
                                                        )}
                                                        <div>
                                                            <h4 className={`font-bold mb-1 ${
                                                                quizSelection === activeBlog.quiz.correct ? 'text-green-400' : 'text-red-400'
                                                            }`}>
                                                                {quizSelection === activeBlog.quiz.correct ? 'Correct!' : 'Incorrect'}
                                                            </h4>
                                                            <p className="text-slate-300 text-sm leading-relaxed">
                                                                {activeBlog.quiz.explanation}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => { setQuizSubmitted(false); setQuizSelection(null); }}
                                                        className="text-sm text-slate-400 hover:text-white underline decoration-slate-600 underline-offset-4"
                                                    >
                                                        Try Again
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDITOR MODAL (New Feature) */}
                    {showEditor && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/95 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-slate-800 w-full max-w-4xl h-[85vh] rounded-2xl border border-slate-700 shadow-2xl flex flex-col overflow-hidden">
                                {/* Header */}
                                <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                                    <h2 className="text-2xl font-bold text-white flex items-center gap-2"><Settings width={24} height={24} className="text-cyan-400" /> Content Editor</h2>
                                    <button onClick={() => setShowEditor(false)} className="p-2 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white"><X width={24} height={24} /></button>
                                </div>
                                
                                {/* Scrollable Content */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-8">
                                    
                                    {/* Profile Section */}
                                    <section className="space-y-4">
                                        <h3 className="text-lg font-bold text-cyan-400 uppercase tracking-wider border-b border-slate-700 pb-2">Profile Information</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-xs text-slate-400 uppercase">Full Name</label>
                                                <input type="text" name="name" value={profile.name} onChange={handleProfileChange} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-xs text-slate-400 uppercase">Tagline</label>
                                                <input type="text" name="tagline" value={profile.tagline} onChange={handleProfileChange} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="md:col-span-2 space-y-1">
                                                <label className="text-xs text-slate-400 uppercase">Bio</label>
                                                <textarea name="bio" value={profile.bio} onChange={handleProfileChange} rows="3" className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-xs text-slate-400 uppercase">Role</label>
                                                <input type="text" name="role" value={profile.role} onChange={handleProfileChange} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-cyan-500 outline-none" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-xs text-slate-400 uppercase">Email</label>
                                                <input type="text" name="email" value={profile.email} onChange={handleProfileChange} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-cyan-500 outline-none" />
                                            </div>
                                        </div>
                                    </section>

                                    {/* Skills Section */}
                                    <section className="space-y-4">
                                        <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                                            <h3 className="text-lg font-bold text-cyan-400 uppercase tracking-wider">Skills</h3>
                                            <button onClick={addSkill} className="text-xs bg-cyan-500/20 text-cyan-400 px-2 py-1 rounded hover:bg-cyan-500 hover:text-slate-900 transition-colors flex items-center gap-1"><Plus width={14} height={14} /> Add Skill</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {skills.map(skill => (
                                                <div key={skill.id} className="bg-slate-900 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-2">
                                                    <span className="text-slate-300 text-sm">{skill.name}</span>
                                                    <button onClick={() => removeSkill(skill.id)} className="text-red-400 hover:text-red-300"><X width={14} height={14} /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </section>

                                    {/* Projects Section */}
                                    <section className="space-y-4">
                                        <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                                            <h3 className="text-lg font-bold text-cyan-400 uppercase tracking-wider">Projects</h3>
                                            <button onClick={addProject} className="text-xs bg-cyan-500/20 text-cyan-400 px-2 py-1 rounded hover:bg-cyan-500 hover:text-slate-900 transition-colors flex items-center gap-1"><Plus width={14} height={14} /> Add Project</button>
                                        </div>
                                        <div className="space-y-4">
                                            {projects.map(project => (
                                                <div key={project.id} className="bg-slate-900 p-4 rounded border border-slate-700 relative">
                                                    <button onClick={() => removeProject(project.id)} className="absolute top-2 right-2 text-slate-500 hover:text-red-400"><Trash width={16} height={16} /></button>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                        <div className="space-y-1">
                                                            <label className="text-xs text-slate-500">Project Title</label>
                                                            <input type="text" value={project.title} onChange={(e) => updateProject(project.id, 'title', e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded p-1 text-sm text-white" />
                                                        </div>
                                                        <div className="space-y-1">
                                                            <label className="text-xs text-slate-500">Description</label>
                                                            <input type="text" value={project.desc} onChange={(e) => updateProject(project.id, 'desc', e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded p-1 text-sm text-white" />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>

                                </div>
                                
                                {/* Footer Actions */}
                                <div className="p-6 border-t border-slate-700 bg-slate-800 flex justify-end gap-3">
                                    <button onClick={() => setShowEditor(false)} className="px-6 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold">Done</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
